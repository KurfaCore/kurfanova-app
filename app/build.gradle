plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kurfacode.kurfamuzik'
    compileSdk 34

    defaultConfig {
        applicationId "com.kurfacode.kurfamuzik"
        minSdk 24
        targetSdk 34
        def ciVersionCode = project.hasProperty('appVersionCode') ? project.property('appVersionCode').toInteger() : 4
        def ciVersionName = project.hasProperty('appVersionName') ? project.property('appVersionName').toString() : "1.2.1"
        versionCode ciVersionCode
        versionName ciVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.27.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
