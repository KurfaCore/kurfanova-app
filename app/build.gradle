plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kurfacode.kurfamuzik'
    compileSdk 34

    defaultConfig {
        applicationId "com.kurfacode.kurfamuzik"
        minSdk 24
        targetSdk 34
        def ciVersionCode = project.hasProperty('appVersionCode') ? project.property('appVersionCode').toInteger() : 4
        def ciVersionName = project.hasProperty('appVersionName') ? project.property('appVersionName').toString() : "1.2.1"
        versionCode ciVersionCode
        versionName ciVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        kurfaPersistent {
            def ksFile = file("kurfa-release.p12")
            def ksPass = System.getenv("KURFA_KEYSTORE_PASS")
            def kAlias = System.getenv("KURFA_KEY_ALIAS") ?: "kurfanova"
            def kPass = System.getenv("KURFA_KEY_PASS")
            if (ksFile.exists() && ksPass && kPass) {
                storeFile ksFile
                storePassword ksPass
                keyAlias kAlias
                keyPassword kPass
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            if (file("kurfa-release.p12").exists() && System.getenv("KURFA_KEYSTORE_PASS")) {
                signingConfig signingConfigs.kurfaPersistent
            }
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.27.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
