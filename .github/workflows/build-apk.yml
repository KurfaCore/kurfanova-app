name: Build Kurfanova Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Prepare Persistent Android Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KURFA_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > app/kurfa-release.p12
            keytool -list -keystore app/kurfa-release.p12 -storetype PKCS12 -storepass "$KURFA_KEYSTORE_PASS" | head -n 10
          else
            echo "No persistent keystore secret configured; falling back to default debug keystore."
          fi

      - name: Build Debug APK with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          KURFA_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KURFA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KURFA_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          VER_CODE=$((GITHUB_RUN_NUMBER + 3))
          VER_NAME="1.2.${GITHUB_RUN_NUMBER}"
          echo "Building APK versionCode=${VER_CODE} versionName=${VER_NAME}"
          gradle assembleDebug -PappVersionCode="${VER_CODE}" -PappVersionName="${VER_NAME}" --no-daemon --stacktrace

      - name: Cleanup Keystore File
        if: always()
        run: rm -f app/kurfa-release.p12

      - name: Prepare APK Output & Update Manifest
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Kurfanova-Muzik.apk
          VER_CODE=$((GITHUB_RUN_NUMBER + 3))
          VER_NAME="1.2.${GITHUB_RUN_NUMBER}"
          SHA256=$(sha256sum dist/Kurfanova-Muzik.apk | awk '{print $1}')
          SIZE=$(stat -c%s dist/Kurfanova-Muzik.apk)
          printf '%s  Kurfanova-Muzik.apk\n' "${SHA256}" > dist/SHA256SUMS-android.txt
          cat > dist/apk-update.json <<EOF
          {
            "versionCode": ${VER_CODE},
            "versionName": "${VER_NAME}",
            "sha256": "${SHA256}",
            "size": ${SIZE},
            "url": "https://github.com/KurfaCore/kurfanova-app/releases/latest/download/Kurfanova-Muzik.apk"
          }
          EOF
          ls -lh dist/Kurfanova-Muzik.apk dist/apk-update.json dist/SHA256SUMS-android.txt

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kurfanova-Muzik-APK
          path: |
            dist/Kurfanova-Muzik.apk
            dist/apk-update.json
            dist/SHA256SUMS-android.txt

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "Kurfamüzik — Windows Masaüstü & Android Sürümü"
          make_latest: true
          body: |
            Kurfamüzik resmi **Windows Masaüstü (x64)** ve **Android APK (`v1.2.${{ github.run_number }}`)** kurulum paketleri.

            ### İndirme Dosyaları
            - **Windows Kurulum (Önerilen):** `Kurfamuzik-Setup.exe` (Windows 10 / 11 x64 Inno Setup, yönetici izni gerektirmez)
            - **Windows Taşınabilir (Portable):** `Kurfanova-Muzik-Windows.exe` (Windows 10 / 11 x64, tek dosya)
            - **Android:** `Kurfanova-Muzik.apk` (Android 7.0+)

            ### Öne Çıkan Yenilikler
            - Şeffaf arka plansız logo ve Windows 10/11 uyumlu 32-bit cam katmanlı `MiniPlayer` / tepsi menüsü
            - Yerel ses dosyaları için gerçek süre okuma ve temiz parça/sanatçı başlığı ayrıştırma
            - Türkçe / İngilizce (`TR` / `EN`) tam dil desteği ve özel indirme klasörü seçimi
            - Kalıcı yerel kullanıcı verisi (`user-data.json`) ve birincil sunucuya erişilemediğinde otomatik Worker yedek geçişi
            - `win-update.json` ve `apk-update.json` üzerinden SHA-256 doğrulamalı otomatik güncelleme

            ### Doğrulama & SHA-256
            - Windows SHA-256: [`SHA256SUMS-windows.txt`](https://github.com/KurfaCore/kurfanova-app/releases/latest/download/SHA256SUMS-windows.txt)
            - Android SHA-256: [`SHA256SUMS-android.txt`](https://github.com/KurfaCore/kurfanova-app/releases/latest/download/SHA256SUMS-android.txt)
            - Windows manifest: [`win-update.json`](https://github.com/KurfaCore/kurfanova-app/releases/latest/download/win-update.json)
            - Android manifest: [`apk-update.json`](https://github.com/KurfaCore/kurfanova-app/releases/latest/download/apk-update.json)
          files: |
            dist/Kurfanova-Muzik.apk
            dist/apk-update.json
            dist/SHA256SUMS-android.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
