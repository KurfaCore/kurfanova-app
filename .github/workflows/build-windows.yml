name: Build Kurfanova Windows Desktop

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop-windows/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Desktop Installer & Portable EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Multi-File Build & Build Inno Setup Installer
        shell: pwsh
        run: |
          $patch = [Math]::Max(0, [int]$env:GITHUB_RUN_NUMBER - 20)
          $appVersion = "1.2.$patch"
          Write-Host "Building Kurfanova Windows Desktop Installer v$appVersion"

          dotnet publish desktop-windows/KurfanovaMuzik.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=$appVersion `
            -p:AssemblyVersion="$appVersion.0" `
            -p:FileVersion="$appVersion.0" `
            -p:PublishSingleFile=false `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o dist-win-inno

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "ISCC.exe not found; installing Inno Setup via Chocolatey..."
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler (ISCC.exe) could not be found."
          }

          New-Item -ItemType Directory -Force -Path "dist-win" | Out-Null
          $sourceDir = (Resolve-Path "dist-win-inno").Path
          $outputDir = (Resolve-Path "dist-win").Path
          & $iscc "/DMyAppVersion=$appVersion" "/DSourceDir=$sourceDir" "/DOutputDir=$outputDir" "desktop-windows/installer/Kurfamuzik.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC.exe failed with exit code $LASTEXITCODE"
          }

      - name: Publish Portable Single-File Windows Executable
        shell: pwsh
        run: |
          $patch = [Math]::Max(0, [int]$env:GITHUB_RUN_NUMBER - 20)
          $appVersion = "1.2.$patch"
          Write-Host "Building Kurfanova Windows Portable EXE v$appVersion"

          dotnet publish desktop-windows/KurfanovaMuzik.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=$appVersion `
            -p:AssemblyVersion="$appVersion.0" `
            -p:FileVersion="$appVersion.0" `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=false `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o dist-win-portable

          Copy-Item "dist-win-portable/Kurfanova-Muzik-Windows.exe" "dist-win/Kurfanova-Muzik-Windows.exe" -Force

      - name: Verify Artifacts, Generate SHA-256 Sums & Update Manifest
        shell: pwsh
        run: |
          $patch = [Math]::Max(0, [int]$env:GITHUB_RUN_NUMBER - 20)
          $appVersion = "1.2.$patch"
          $setupExe = Get-Item "dist-win/Kurfamuzik-Setup.exe"
          $portableExe = Get-Item "dist-win/Kurfanova-Muzik-Windows.exe"
          $setupSha = (Get-FileHash $setupExe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $portableSha = (Get-FileHash $portableExe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()

          $sums = @(
            "$setupSha  Kurfamuzik-Setup.exe"
            "$portableSha  Kurfanova-Muzik-Windows.exe"
          ) -join "`n"
          [System.IO.File]::WriteAllText("dist-win/SHA256SUMS-windows.txt", $sums + "`n", [System.Text.UTF8Encoding]::new($false))

          $manifest = [ordered]@{
            version = $appVersion
            sha256 = $portableSha
            size = $portableExe.Length
            url = "https://github.com/KurfaCore/kurfanova-app/releases/latest/download/Kurfanova-Muzik-Windows.exe"
            installerUrl = "https://github.com/KurfaCore/kurfanova-app/releases/latest/download/Kurfamuzik-Setup.exe"
            installerSha256 = $setupSha
            installerSize = $setupExe.Length
            notes = "Kurfamüzik Masaüstü v${appVersion}: Yerel video proxy desteği, kapak renkli cam MiniPlayer, Windows arka plan oynatma ve bildirim logosu iyileştirmeleri, FX ve şarkı sözü güncellemeleri."
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText("dist-win/win-update.json", $manifest, [System.Text.UTF8Encoding]::new($false))

          Write-Host "Setup: $($setupExe.FullName) ($($setupExe.Length) bytes) sha256=$setupSha"
          Write-Host "Portable: $($portableExe.FullName) ($($portableExe.Length) bytes) sha256=$portableSha"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kurfanova-Muzik-Windows
          path: |
            dist-win/Kurfamuzik-Setup.exe
            dist-win/Kurfanova-Muzik-Windows.exe
            dist-win/win-update.json
            dist-win/SHA256SUMS-windows.txt

      - name: Upload Windows Assets to Release v1.0.0-apk
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v1.0.0-apk dist-win/Kurfamuzik-Setup.exe dist-win/Kurfanova-Muzik-Windows.exe dist-win/win-update.json dist-win/SHA256SUMS-windows.txt --clobber
